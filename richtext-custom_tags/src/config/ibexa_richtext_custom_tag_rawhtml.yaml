            template: "@standard/ibexa_richtext/custom_tags/rawhtml.html.twig"
            icon: '/bundles/ibexaicons/img/all-icons.svg#information'
            attributes:
                name:
                    type: string

ibexa:
    system:
        admin_group:
            fieldtypes:
                ibexa_richtext:
                    custom_tags:
                        - rawhtml
                    toolbar:
                        custom_tags_group:
                            buttons:
                                rawhtml:
                                    priority: 95